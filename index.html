<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>↑ここをタップ！</title>
  <style>
    body {
      background-color: #1b4332;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 30px 15px 60px 15px;
      margin: 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      border: 3px solid #ffffff;
      border-radius: 20px;
      padding: 30px 15px;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    h1 {
      color: #ffeb3b;
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
    }
    /* セクション同士の余白をさらに大幅に広げる */
    .box {
      margin-top: 50px;
      padding-top: 35px;
      border-top: 1px dashed rgba(255, 255, 255, 0.4);
    }
    .btn {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      user-select: none;
      margin: 5px;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .quiz-btn {
      display: block;
      width: 100%;
      background-color: #2196f3;
      text-align: left;
      padding: 12px 15px;
      box-sizing: border-box;
      margin-top: 10px;
    }
    .game-btn {
      background-color: #e91e63;
      width: 100%;
      max-width: 250px;
      height: 65px;
      font-size: 18px;
      border-radius: 15px;
      margin-top: 15px;
    }
    .game-btn:disabled {
      background-color: #888;
      opacity: 0.6;
    }
    /* おみくじ結果のサイズと改行調整 */
    #result {
      font-size: 15px;
      font-weight: bold;
      color: #ffeb3b;
      margin-top: 15px;
      min-height: 40px;
      line-height: 1.5;
      padding: 0 5px;
    }
    #game-result, .quiz-ans {
      font-size: 16px;
      font-weight: bold;
      color: #ffeb3b;
      margin-top: 12px;
    }
    .menu-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 15px;
      margin-top: 15px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      padding: 12px 0;
      font-weight: bold;
    }
    .menu-item:last-child {
      border-bottom: none;
      color: #ffeb3b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>✨ ようこそ3年6組へ！！ ✨</h1>
    <p>QRコードを読み取ってくれてありがとう！</p>

    <!-- メニュー -->
    <div class="box">
      <p style="font-weight: bold; font-size: 18px; margin: 0 0 10px 0;">🍧 MENU 🍧</p>
      <div class="menu-container">
        <div class="menu-item"><span>🍊 冷凍みかん</span><span>200円</span></div>
        <div class="menu-item"><span>🍌 チョコバナナ</span><span>300円</span></div>
        <div class="menu-item"><span>🍍 冷凍パイン</span><span>300円</span></div>
        <div class="menu-item"><span>🍧 フローズンパイン</span><span>300円</span></div>
        <div class="menu-item"><span>😊 スマイル</span><span>0円</span></div>
      </div>
    </div>

    <!-- おみくじ -->
    <div class="box">
      <p style="font-weight: bold; font-size: 18px; margin: 0 0 10px 0;">🔮 今日の運勢 🔮</p>
      <button class="btn" onclick="drawOmikuji()">おみくじを引く！</button>
      <div id="result"></div>
    </div>

    <!-- 3年6組クイズ -->
    <div class="box">
      <p style="font-weight: bold; font-size: 18px; margin: 0 0 15px 0;">❓ 3年6組クイズ ❓</p>

      <!-- Q1 -->
      <div style="text-align: left; margin-top: 20px;">
        <p style="font-weight: bold; margin: 5px 0;">Q1. 3年6組の担任の先生は？</p>
        <button class="btn quiz-btn" onclick="checkQuiz(1, 1)">1. 崎山先生</button>
        <button class="btn quiz-btn" onclick="checkQuiz(1, 2)">2. 鷲尾先生</button>
        <button class="btn quiz-btn" onclick="checkQuiz(1, 3)">3. 今井先生</button>
        <div id="q1-ans" class="quiz-ans"></div>
      </div>

      <!-- Q2 -->
      <div style="text-align: left; margin-top: 25px;">
        <p style="font-weight: bold; margin: 5px 0;">Q2. 3年6組の人数は？</p>
        <button class="btn quiz-btn" onclick="checkQuiz(2, 1)">1. 40人</button>
        <button class="btn quiz-btn" onclick="checkQuiz(2, 2)">2. 38人</button>
        <button class="btn quiz-btn" onclick="checkQuiz(2, 3)">3. 36人</button>
        <div id="q2-ans" class="quiz-ans"></div>
      </div>

      <!-- Q3 -->
      <div style="text-align: left; margin-top: 25px;">
        <p style="font-weight: bold; margin: 5px 0;">Q3. このQRコードを描いたのは誰？</p>
        <button class="btn quiz-btn" onclick="checkQuiz(3, 1)">1. 担任の先生</button>
        <button class="btn quiz-btn" onclick="checkQuiz(3, 2)">2. 文化祭実行委員</button>
        <button class="btn quiz-btn" onclick="checkQuiz(3, 3)">3. 暇だった人</button>
        <div id="q3-ans" class="quiz-ans"></div>
      </div>
    </div>

    <!-- 10秒連打ゲーム -->
    <div class="box">
      <p style="font-weight: bold; font-size: 18px; margin: 0 0 10px 0;">🎮 10秒連打チャレンジ！ 🎮</p>
      <p style="font-size: 13px; margin-bottom: 15px;">10秒間でボタンを何回連打できるか勝負！</p>
      <div id="timer" style="font-size: 16px; font-weight: bold;">残り時間: 10秒</div>
      <div id="score" style="font-size: 22px; font-weight: bold; color: #ffeb3b; margin: 10px 0;">スコア: 0回</div>
      
      <button id="tap-btn" class="btn game-btn" onclick="tapGame()">タップしてスタート！</button>
      <div id="game-result"></div>
    </div>
  </div>

  <script>
    // --- おみくじ ---
    function drawOmikuji() {
      const results = [
        "🎉 超大吉：3年6組で最高の思い出ができる！",
        "✨ 大吉：冷凍みかんを食べると運気倍増！",
        "☘️ 中吉：冷たいメニューで気分も最高！",
        "🌟 吉：笑顔があふれる素敵な一日になりそう！",
        "🎯 小吉：クイズに全問正解できるかも！？",
        "🔥 凶：連打ゲームで100回出せば大吉に昇格！"
      ];
      const random = Math.floor(Math.random() * results.length);
      document.getElementById("result").innerText = results[random];
    }

    // --- クイズ判定 ---
    function checkQuiz(qNum, choice) {
      const answers = { 1: 2, 2: 3, 3: 3 };
      const targetDiv = document.getElementById(`q${qNum}-ans`);
      
      if (choice === answers[qNum]) {
        targetDiv.innerText = "⭕ 正解！さすが！";
        targetDiv.style.color = "#76ff03";
      } else {
        targetDiv.innerText = "❌ 残念！";
        targetDiv.style.color = "#ff5252";
      }
    }

    // --- 10秒連打ゲーム ---
    let count = 0;
    let timeLeft = 10;
    let timerId = null;
    let isPlaying = false;

    function tapGame() {
      const btn = document.getElementById('tap-btn');
      
      if (!isPlaying) {
        isPlaying = true;
        count = 1;
        timeLeft = 10;
        document.getElementById('game-result').innerText = "";
        document.getElementById('score').innerText = "スコア: " + count + "回";
        btn.innerText = "連打しろーー！";

        timerId = setInterval(() => {
          timeLeft--;
          document.getElementById('timer').innerText = "残り時間: " + timeLeft + "秒";
          
          if (timeLeft <= 0) {
            clearInterval(timerId);
            isPlaying = false;
            btn.disabled = true;
            btn.innerText = "終了！結果発表！";

            let rank = "";
            if (count >= 100) rank = "👑 100回越え!? 連打の神降臨！";
            else if (count >= 80) rank = "⚡ 超人レベル！指から光出てる！";
            else if (count >= 65) rank = "🏆 達人レベル！人間卒業！";
            else if (count >= 50) rank = "🔥 プロ連打士！めちゃくちゃ早い！";
            else if (count >= 35) rank = "👍 平均越え！かなりの高速連打！";
            else rank = " ナイスチャレンジ！";

            document.getElementById('game-result').innerText = rank;

            setTimeout(() => {
              btn.disabled = false;
              btn.innerText = "もう一度遊ぶ！";
            }, 5000);
          }
        }, 1000);
      } else {
        count++;
        document.getElementById('score').innerText = "スコア: " + count + "回";
      }
    }
  </script>

</body>
</html>
